</nav><main class="container"><section class="page-title py-5 mt-4 mb-5 text-center"><h1>Contact Us</h1><p class="mb-0">Have a destination in mind? Send us a message.</p></section><section class="row justify-content-center pb-5"><div class="col-12 col-lg-8"><div class="card shadow-sm"><img class="card-img-top contact-image" src="images/concat.jpeg" alt="Travel communication illustration"><div class="card-body p-4 p-md-5"><form id="contactForm" action="#" method="post" novalidate><div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required></div><div class="mb-3"><label for="email" class="form-label">Email</label><div class="input-group"><span class="input-group-text">@</span><input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required></div></div><div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" class="form-control" id="password" name="password" minlength="8" placeholder="At least 8 characters" required><div class="invalid-feedback">Password must contain at least 8 characters.</div></div><div class="mb-3"><label for="confirmPassword" class="form-label">Confirm password</label><input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required><div class="invalid-feedback">Passwords must match.</div></div><div class="mb-3"><label for="destination" class="form-label">Favorite destination</label><select class="form-select" id="destination" name="destination"><option value="japan">Japan</option><option value="italy">Italy</option><option value="kazakhstan">Kazakhstan</option><option value="other">Other</option></select></div><fieldset class="mb-3"><legend class="fs-6">Choose your travel mood:</legend><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="mood" id="adventure" value="adventure" checked><label class="form-check-label" for="adventure">Adventure</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="mood" id="relaxation" value="relaxation"><label class="form-check-label" for="relaxation">Relaxation</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="mood" id="culture" value="culture"><label class="form-check-label" for="culture">Culture</label></div></fieldset><div class="mb-4"><label for="message" class="form-label">Message</label><textarea class="form-control" id="message" name="message" rows="6" placeholder="Write your message"></textarea></div><p id="formMessage" class="mt-3" aria-live="polite"></p><div class="d-grid d-sm-flex gap-2"><button type="submit" class="btn btn-primary btn-lg">Send Message</button><button type="reset" class="btn btn-outline-secondary btn-sm align-self-sm-center">Clear</button></div></form></div></div></div></section></main><footer class="site-footer mt-5 py-4 text-center">
